<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <section class="fact-panel" aria-labelledby="fact-heading">
      <h2 id="fact-heading">Did you know?</h2>
      <p id="spaceFact"></p>
    </section>

    <form class="filters" id="dateForm">
      <label class="form-label" for="startDate">From
        <input class="form-control form-control-lg" type="text" id="startDate" placeholder="Choose a start date" required />
      </label>
      <label class="form-label" for="endDate">Through
        <input class="form-control form-control-lg" type="text" id="endDate" placeholder="Choose an end date" required />
      </label>
      <button class="btn btn-danger btn-lg" type="submit" id="getImagesButton">Get Space Images</button>
    </form>

    <p class="gallery-status" id="galleryStatus" role="status" aria-live="polite"></p>

    <div id="gallery" class="gallery">
      <div class="gallery-empty">
        <div class="gallery-empty-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog class="image-modal" id="imageModal" aria-labelledby="modalTitle">
    <button class="modal-close" id="closeModal" type="button" aria-label="Close image details">&times;</button>
    <img class="modal-image" id="modalImage" alt="" />
    <div class="modal-copy">
      <p class="modal-date" id="modalDate"></p>
      <h2 id="modalTitle"></h2>
      <p class="modal-explanation" id="modalExplanation"></p>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
